name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Install Playwright Chromium (for live tests)
        run: npx playwright install --with-deps chromium
      - name: Unit + live tests
        run: npm test
        env:
          PS_BROWSER: bundled
