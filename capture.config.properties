# Page snapshot capture config (optional — auto-loaded from CWD when present)
# CLI flags override these values.

# Output root directory for sessions
outputDir=pageSnapshots

# Create pageSnapshots/session-<timestamp>/ for each run
sessionSubdir=true

# Append framework-dialect hint comments to each YAML
includeHints=false

# Mask password field values and emails in snapshots
redactPasswords=true
redactEmails=true

# Write NN_diff.md between consecutive captures
writeDiff=true

# How many body rows to dump per HTML table
maxTableRows=3

# Copied into PROMPT.md for the coding agent
# framework also selects hint dialect + Reading-Snapshots mapping
framework=playwright
style=pageobject
waits=web-first

# Optional default goal (also: --goal=...)
# goal=Register a new user and verify success

# Optional cookie / storageState paths
# loadCookies=cookies.json
# saveCookies=cookies.json
# loadStorage=storageState.json
# saveStorage=storageState.json

# Floating toolbar dock: left | middle | right (also: --toolbar-position=)
toolbarPosition=right

# IANA zone for session folder timestamps (also: --timezone=)
timezone=America/New_York

# Token-lean defaults (flags beat these)
# lean=true
# noUrls=true
# writeAria=false
